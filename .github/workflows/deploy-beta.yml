name: Deploy Beta Preview to AWS CloudPanel

on:
  push:
    branches:
      - ignitedev
  workflow_dispatch:

concurrency:
  group: ignite-beta-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy ignitedev to protected beta site
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo -u ignitetraininginstitute-beta -H bash -lc '
              set -Eeuo pipefail
              export NVM_DIR=/home/ignitetraininginstitute-beta/.nvm
              source "$NVM_DIR/nvm.sh"
              nvm use 22

              APP_DIR=/home/ignitetraininginstitute-beta/htdocs/beta.ignitetraininginstitute.com/releases/ignitedev
              cd "$APP_DIR"

              git fetch origin ignitedev
              git reset --hard origin/ignitedev
              npm ci
              rm -rf .next
              npm run build

              pm2 restart beta-app --update-env
              pm2 save
            '

            curl --fail --silent --show-error --retry 10 --retry-delay 2 \
              --retry-connrefused \
              http://127.0.0.1:3001/ >/dev/null
